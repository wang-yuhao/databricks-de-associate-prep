  <text x="28" y="36" class="t">Narrow vs wide transformations</text>
  <text x="24" y="70" class="b">Narrow: filter, select, withColumn</text>
  <text x="24" y="89" class="n">each output partition reads ONE input partition</text>
  <text x="504" y="70" class="b">Wide: groupBy, join, distinct, orderBy</text>
  <text x="504" y="89" class="n">each output partition reads from ALL input partitions</text>
