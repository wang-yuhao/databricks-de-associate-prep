<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="k-anonymity: raw quasi-identifiers make every row unique; generalization forms equivalence classes and suppression removes a class of one">
  <rect x="0.75" y="0.75" width="958.5" height="498.5" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <style>
    .t{font-size:18px;font-weight:600;fill:#0b0b0b}
    .h{font-size:14px;font-weight:600;fill:#0b0b0b}
    .l{font-size:13px;fill:#0b0b0b}
    .n{font-size:12px;fill:#52514e}
    .ln{stroke:#52514e;stroke-width:1.5;fill:none}
    .row{stroke:#e4e2dc;stroke-width:1}
  </style>
  <text x="24" y="36" class="t">k-anonymity: generalize, then suppress rare groups</text>
  <text x="24" y="58" class="n">k = size of the smallest group of rows that share the same quasi-identifiers. k = 1 means someone can be singled out.</text>

  <!-- raw table -->
  <text x="40" y="92" class="h">Raw quasi-identifiers</text>
  <rect x="40" y="102" width="330" height="270" rx="8" fill="#2a78d6" fill-opacity="0.06" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="56" y="124" class="n">zip</text><text x="146" y="124" class="n">birth_year</text><text x="236" y="124" class="n">gender</text><text x="306" y="124" class="n">class size</text>
  <line x1="40" y1="134" x2="370" y2="134" class="row"/>
  <g class="l">
    <text x="56" y="158">10115</text><text x="146" y="158">1988</text><text x="236" y="158">F</text><text x="306" y="158">1</text>
    <text x="56" y="192">10117</text><text x="146" y="192">1990</text><text x="236" y="192">F</text><text x="306" y="192">1</text>
    <text x="56" y="226">10119</text><text x="146" y="226">1992</text><text x="236" y="226">F</text><text x="306" y="226">1</text>
    <text x="56" y="260">94105</text><text x="146" y="260">1980</text><text x="236" y="260">M</text><text x="306" y="260">1</text>
    <text x="56" y="294">94107</text><text x="146" y="294">1983</text><text x="236" y="294">M</text><text x="306" y="294">1</text>
    <text x="56" y="328">94110</text><text x="146" y="328">1981</text><text x="236" y="328">M</text><text x="306" y="328">1</text>
    <text x="56" y="362">10245</text><text x="146" y="362">1950</text><text x="236" y="362">F</text><text x="306" y="362">1</text>
  </g>
  <text x="40" y="398" class="h">k = 1</text>
  <text x="90" y="398" class="n">every person is unique</text>

  <!-- arrow -->
  <path d="M380,240 H496" class="ln" marker-end="url(#arr)"/>
  <text x="438" y="214" class="n" text-anchor="middle">zip → region</text>
  <text x="438" y="230" class="n" text-anchor="middle">year → age band</text>

  <!-- generalized table -->
  <text x="506" y="92" class="h">Generalized</text>
  <rect x="506" y="102" width="290" height="270" rx="8" fill="#1baf7a" fill-opacity="0.06" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="522" y="124" class="n">age_band</text><text x="622" y="124" class="n">region</text><text x="712" y="124" class="n">gender</text>
  <line x1="506" y1="134" x2="796" y2="134" class="row"/>
  <rect x="514" y="140" width="274" height="100" rx="6" fill="#52514e" fill-opacity="0.1"/>
  <rect x="514" y="242" width="274" height="100" rx="6" fill="#52514e" fill-opacity="0.1"/>
  <rect x="514" y="344" width="274" height="24" rx="6" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <g class="l">
    <text x="522" y="158">30-39</text><text x="622" y="158">EU</text><text x="712" y="158">F</text>
    <text x="522" y="192">30-39</text><text x="622" y="192">EU</text><text x="712" y="192">F</text>
    <text x="522" y="226">30-39</text><text x="622" y="226">EU</text><text x="712" y="226">F</text>
    <text x="522" y="260">40-49</text><text x="622" y="260">US</text><text x="712" y="260">M</text>
    <text x="522" y="294">40-49</text><text x="622" y="294">US</text><text x="712" y="294">M</text>
    <text x="522" y="328">40-49</text><text x="622" y="328">US</text><text x="712" y="328">M</text>
    <text x="522" y="362">70-79</text><text x="622" y="362">EU</text><text x="712" y="362">F</text>
  </g>
  <line x1="518" y1="358" x2="784" y2="358" stroke="#e34948" stroke-width="1.5"/>

  <!-- class labels -->
  <path d="M800,144 h8 v92 h-8" class="ln"/>
  <text x="816" y="186" class="h">class A</text>
  <text x="816" y="204" class="n">3 rows</text>
  <path d="M800,246 h8 v92 h-8" class="ln"/>
  <text x="816" y="288" class="h">class B</text>
  <text x="816" y="306" class="n">3 rows</text>
  <text x="816" y="356" class="h">1 row</text>
  <text x="816" y="372" class="n">suppressed</text>

  <text x="506" y="398" class="h">k = 3</text>
  <text x="556" y="398" class="n">after dropping the class of one (k would be 1 otherwise)</text>

  <text x="40" y="440" class="n">Illustration with 7 rows and a target of k = 3. The code below measures k on the real data and suppresses every class smaller than K = 5.</text>
  <text x="40" y="458" class="n">Direct identifiers (name, email, ssn) are removed entirely; only generalized quasi-identifiers remain.</text>

  <rect x="40" y="474" width="14" height="14" rx="3" fill="#52514e" fill-opacity="0.1"/>
  <text x="62" y="486" class="n">equivalence class (same quasi-identifiers)</text>
  <rect x="320" y="474" width="14" height="14" rx="3" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="342" y="486" class="n">suppressed row</text>
</svg>
