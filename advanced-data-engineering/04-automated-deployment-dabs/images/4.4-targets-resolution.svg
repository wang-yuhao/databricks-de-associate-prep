<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="499" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .src{fill:#2a78d6;fill-opacity:0.12;stroke:#2a78d6;stroke-width:1.5}
      .cfg{fill:#52514e;fill-opacity:0.1;stroke:#52514e;stroke-width:1.5}
      .dev{fill:#6250d6;fill-opacity:0.12;stroke:#6250d6;stroke-width:1.5}
      .stg{fill:#eda100;fill-opacity:0.12;stroke:#eda100;stroke-width:1.5}
      .prd{fill:#eb6834;fill-opacity:0.08;stroke:#eb6834;stroke-width:1.5;stroke-dasharray:5 4}
    </style>
  </defs>
  <text x="30" y="36" class="t">One bundle, many targets: bundles/02_multi_env_dab</text>

  <!-- shared definition -->
  <rect x="30" y="64" width="290" height="160" rx="8" class="src"/>
  <text x="44" y="88" class="b">Shared definition (resources/*.yml)</text>
  <text x="44" y="114" class="l">name: orders_job_${bundle.target}</text>
  <text x="44" y="134" class="l">schema: ${var.schema}</text>
  <text x="44" y="154" class="l">rows: ${var.orders_per_run}</text>
  <text x="44" y="174" class="l">landing_path: /Volumes/${var.catalog}/</text>
  <text x="58" y="190" class="l">${var.schema}/landing/orders</text>
  <text x="44" y="212" class="l">schedule: daily 06:00</text>

  <!-- value precedence -->
  <rect x="30" y="246" width="290" height="176" rx="8" class="cfg"/>
  <text x="44" y="270" class="b">Where values come from</text>
  <text x="44" y="292" class="n">lowest priority first; later ones win</text>
  <text x="44" y="318" class="l">1  variables: default</text>
  <text x="64" y="336" class="n">catalog = workspace, orders_per_run = 500</text>
  <text x="44" y="362" class="l">2  targets.&lt;name&gt;.variables</text>
  <text x="64" y="380" class="n">dev: schema orders_dev, orders_per_run 100</text>
  <text x="44" y="404" class="l">3  --var flag or BUNDLE_VAR_&lt;name&gt; env var</text>

  <!-- resolver -->
  <rect x="360" y="206" width="160" height="76" rx="8" class="cfg"/>
  <text x="374" y="232" class="b">-t &lt;target&gt;</text>
  <text x="374" y="252" class="l">validate / deploy</text>
  <text x="374" y="269" class="l">resolve every ${...}</text>
  <line x1="320" y1="180" x2="358" y2="226" class="ar"/>
  <line x1="320" y1="300" x2="358" y2="264" class="ar"/>

  <!-- resolved targets -->
  <rect x="560" y="64" width="370" height="120" rx="8" class="dev"/>
  <text x="574" y="88" class="b">dev · mode: development</text>
  <text x="574" y="112" class="l">job [dev &lt;you&gt;] orders_job_dev</text>
  <text x="574" y="130" class="l">schema workspace.orders_dev · rows 100</text>
  <text x="574" y="148" class="l">schedule PAUSED · pipeline development: true</text>
  <text x="574" y="170" class="n">root: /Workspace/Users/&lt;you&gt;/.bundle/orders_etl/dev</text>

  <rect x="560" y="204" width="370" height="120" rx="8" class="stg"/>
  <text x="574" y="228" class="b">stage · mode: production</text>
  <text x="574" y="252" class="l">job orders_job_stage</text>
  <text x="574" y="270" class="l">schema workspace.orders_stage · rows 500</text>
  <text x="574" y="288" class="l">schedule active (UNPAUSED)</text>
  <text x="574" y="310" class="n">root: /Workspace/Shared/.bundle/orders_etl/stage</text>

  <rect x="560" y="344" width="370" height="78" rx="8" class="prd"/>
  <text x="574" y="368" class="b">prod · mode: production <tspan class="n" font-weight="400">(pattern in 03_cicd_dab)</tspan></text>
  <text x="574" y="390" class="l">own schema, shared root_path,</text>
  <text x="574" y="408" class="l">run_as a service principal</text>

  <line x1="520" y1="226" x2="558" y2="130" class="ar"/>
  <line x1="520" y1="244" x2="558" y2="260" class="ar"/>
  <line x1="520" y1="268" x2="558" y2="376" class="ar" stroke-dasharray="5 4"/>

  <text x="30" y="456" class="n">Blue = shared source · grey = values and resolution · purple = dev · amber = stage · orange dashed = prod (not in this bundle).</text>
  <text x="30" y="476" class="n">Same YAML, different names, schemas and paths: environments never collide, and promotion changes only values.</text>
</svg>
