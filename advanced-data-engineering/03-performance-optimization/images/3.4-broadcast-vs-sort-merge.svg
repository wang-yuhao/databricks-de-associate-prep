<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="499" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ard{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
    </style>
  </defs>
  <text x="28" y="36" class="t">What moves over the network: broadcast hash join vs sort-merge join</text>
  <text x="24" y="70" class="b">Broadcast hash join</text>
  <text x="504" y="70" class="b">Sort-merge join (broadcast disabled)</text>
  <line x1="480" y1="56" x2="480" y2="470" stroke="#e4e2dc" stroke-width="1"/>
  <rect x="130" y="86" width="220" height="54" rx="8" fill="#52514e" fill-opacity="0.12" stroke="#52514e" stroke-width="1.5"/>
  <text x="240.0" y="108.0" class="b" text-anchor="middle">Driver</text>
  <text x="240.0" y="127.0" class="l" text-anchor="middle">collects products (1,000 rows)</text>
  <rect x="30" y="190" width="132" height="130" rx="8" fill="#1baf7a" fill-opacity="0.08" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="96" y="210" class="b" text-anchor="middle">Executor 1</text>
  <rect x="40" y="222" width="112" height="34" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="96.0" y="244.0" class="n" text-anchor="middle">sales part</text>
  <rect x="40" y="266" width="112" height="34" rx="8" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="96.0" y="288.0" class="n" text-anchor="middle">products copy</text>
  <path d="M240,140 L96,188" class="ar"/>
  <rect x="174" y="190" width="132" height="130" rx="8" fill="#1baf7a" fill-opacity="0.08" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="240" y="210" class="b" text-anchor="middle">Executor 2</text>
  <rect x="184" y="222" width="112" height="34" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="240.0" y="244.0" class="n" text-anchor="middle">sales part</text>
  <rect x="184" y="266" width="112" height="34" rx="8" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="240.0" y="288.0" class="n" text-anchor="middle">products copy</text>
  <path d="M240,140 L240,188" class="ar"/>
  <rect x="318" y="190" width="132" height="130" rx="8" fill="#1baf7a" fill-opacity="0.08" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="384" y="210" class="b" text-anchor="middle">Executor 3</text>
  <rect x="328" y="222" width="112" height="34" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="384.0" y="244.0" class="n" text-anchor="middle">sales part</text>
  <rect x="328" y="266" width="112" height="34" rx="8" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="384.0" y="288.0" class="n" text-anchor="middle">products copy</text>
  <path d="M240,140 L384,188" class="ar"/>
  <text x="240" y="348" class="n" text-anchor="middle">hash join runs locally on each executor:</text>
  <text x="240" y="365" class="n" text-anchor="middle">the 4 M sales rows never leave their executor</text>
  <rect x="30" y="392" width="420" height="54" rx="8" fill="#008300" fill-opacity="0.12" stroke="#008300" stroke-width="1.5"/>
  <text x="240.0" y="414.0" class="b" text-anchor="middle">Network</text>
  <text x="240.0" y="433.0" class="l" text-anchor="middle">only the small table, once per executor (KB)</text>
  <rect x="512" y="86" width="132" height="92" rx="8" fill="#1baf7a" fill-opacity="0.08" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="578" y="104" class="b" text-anchor="middle">Executor 1</text>
  <rect x="522" y="112" width="112" height="26" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="578.0" y="130.0" class="n" text-anchor="middle">sales part</text>
  <rect x="522" y="144" width="112" height="26" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="578.0" y="162.0" class="n" text-anchor="middle">products part</text>
  <path d="M578,178 L578,204" class="ar"/>
  <path d="M578,250 L578,276" class="ar"/>
  <rect x="512" y="278" width="132" height="50" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="578.0" y="298.5" class="b" text-anchor="middle">sort + merge</text>
  <text x="578.0" y="317.5" class="n" text-anchor="middle">product_id range 1</text>
  <rect x="656" y="86" width="132" height="92" rx="8" fill="#1baf7a" fill-opacity="0.08" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="722" y="104" class="b" text-anchor="middle">Executor 2</text>
  <rect x="666" y="112" width="112" height="26" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="722.0" y="130.0" class="n" text-anchor="middle">sales part</text>
  <rect x="666" y="144" width="112" height="26" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="722.0" y="162.0" class="n" text-anchor="middle">products part</text>
  <path d="M722,178 L722,204" class="ar"/>
  <path d="M722,250 L722,276" class="ar"/>
  <rect x="656" y="278" width="132" height="50" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="722.0" y="298.5" class="b" text-anchor="middle">sort + merge</text>
  <text x="722.0" y="317.5" class="n" text-anchor="middle">product_id range 2</text>
  <rect x="800" y="86" width="132" height="92" rx="8" fill="#1baf7a" fill-opacity="0.08" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="866" y="104" class="b" text-anchor="middle">Executor 3</text>
  <rect x="810" y="112" width="112" height="26" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="866.0" y="130.0" class="n" text-anchor="middle">sales part</text>
  <rect x="810" y="144" width="112" height="26" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="866.0" y="162.0" class="n" text-anchor="middle">products part</text>
  <path d="M866,178 L866,204" class="ar"/>
  <path d="M866,250 L866,276" class="ar"/>
  <rect x="800" y="278" width="132" height="50" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="866.0" y="298.5" class="b" text-anchor="middle">sort + merge</text>
  <text x="866.0" y="317.5" class="n" text-anchor="middle">product_id range 3</text>
  <rect x="512" y="206" width="420" height="44" rx="8" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="722.0" y="232.5" class="l" text-anchor="middle">Exchange: hash both sides by product_id, all-to-all</text>
  <text x="722" y="348" class="n" text-anchor="middle">two shuffles, then a sort on each side</text>
  <rect x="512" y="392" width="420" height="54" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="722.0" y="414.0" class="b" text-anchor="middle">Network</text>
  <text x="722.0" y="433.0" class="l" text-anchor="middle">all 4 M sales rows + all products rows (MBs)</text>
  <rect x="24" y="473" width="16" height="14" rx="3" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="46" y="484" class="n">table partition</text>
  <rect x="169.0" y="473" width="16" height="14" rx="3" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="191.0" y="484" class="n">data sent over the network</text>
  <rect x="386.6" y="473" width="16" height="14" rx="3" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="408.6" y="484" class="n">executor work</text>
</svg>
