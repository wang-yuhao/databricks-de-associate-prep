[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orders_lib"
version = "0.1.0"
description = "Transformations for the orders project, unit-tested locally and deployed with a bundle."
requires-python = ">=3.10"

[project.scripts]
daily_summary = "orders_lib.main:daily_summary"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orders_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
