<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ard{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
    </style>
  </defs>
  <text x="28" y="36" class="t">Three ways to lay out a table for skipping</text>
  <rect x="24" y="56" width="288" height="364" rx="8" fill="#52514e" fill-opacity="0.05" stroke="#52514e" stroke-width="1.5"/>
  <text x="40" y="82" class="b">Partitioning</text>
  <text x="40" y="101" class="n">PARTITIONED BY (store_id)</text>
  <rect x="336" y="56" width="288" height="364" rx="8" fill="#52514e" fill-opacity="0.05" stroke="#52514e" stroke-width="1.5"/>
  <text x="352" y="82" class="b">Z-ORDER</text>
  <text x="352" y="101" class="n">OPTIMIZE t ZORDER BY (customer_id)</text>
  <rect x="648" y="56" width="288" height="364" rx="8" fill="#008300" fill-opacity="0.05" stroke="#008300" stroke-width="1.5"/>
  <text x="664" y="82" class="b">Liquid Clustering</text>
  <text x="664" y="101" class="n">CLUSTER BY (customer_id)</text>
  <rect x="40" y="120" width="84" height="30" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="82.0" y="140.0" class="n" text-anchor="middle">store_id=0/</text>
  <rect x="46" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="72" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="98" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="132" y="120" width="84" height="30" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="174.0" y="140.0" class="n" text-anchor="middle">store_id=1/</text>
  <rect x="138" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="164" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="190" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="224" y="120" width="84" height="30" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="266.0" y="140.0" class="n" text-anchor="middle">store_id=49/</text>
  <rect x="230" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="256" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="282" y="162" width="20" height="26" rx="2" fill="#2a78d6" fill-opacity="0.2" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="384" y="118" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="408" y="118" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="432" y="118" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="456" y="118" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="384" y="142" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="408" y="142" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="432" y="142" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="456" y="142" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="384" y="166" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="408" y="166" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="432" y="166" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="456" y="166" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="384" y="190" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="408" y="190" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="432" y="190" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="456" y="190" width="20" height="20" rx="2" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="1.5"/>
  <path d="M394,128 L418,128 L394,152 L418,152 L442,128 L466,128 L442,152 L466,152 L394,176 L418,176 L394,200 L418,200 L442,176 L466,176 L442,200 L466,200" stroke="#52514e" stroke-width="1.5" fill="none"/>
  <text x="496" y="148" class="n">files ordered</text>
  <text x="496" y="164" class="n">along a Z-curve</text>
  <rect x="664" y="120" width="58" height="70" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="693.0" y="152.0" class="n" text-anchor="middle">0k–</text>
  <text x="693.0" y="168.0" class="n" text-anchor="middle">25k</text>
  <rect x="730" y="120" width="58" height="70" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="759.0" y="152.0" class="n" text-anchor="middle">25k–</text>
  <text x="759.0" y="168.0" class="n" text-anchor="middle">50k</text>
  <rect x="796" y="120" width="58" height="70" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="825.0" y="152.0" class="n" text-anchor="middle">50k–</text>
  <text x="825.0" y="168.0" class="n" text-anchor="middle">75k</text>
  <rect x="862" y="120" width="58" height="70" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="891.0" y="152.0" class="n" text-anchor="middle">75k–</text>
  <text x="891.0" y="168.0" class="n" text-anchor="middle">100k</text>
  <text x="40" y="236" class="l">+ prunes whole directories when the</text>
  <text x="40" y="258" class="l">  filter is on the partition column</text>
  <text x="40" y="280" class="l">– no help for other columns</text>
  <text x="40" y="302" class="l">– high cardinality → file explosion</text>
  <text x="40" y="324" class="l">– changing the column = full rewrite</text>
  <text x="40" y="360" class="b">Use for: TB+ tables, low-cardinality</text>
  <text x="40" y="382" class="b">column in almost every filter</text>
  <text x="352" y="236" class="l">+ co-locates values of 1-4 columns</text>
  <text x="352" y="258" class="l">  so min/max ranges barely overlap</text>
  <text x="352" y="280" class="l">– keys are not stored: repeat them</text>
  <text x="352" y="302" class="l">  on every OPTIMIZE</text>
  <text x="352" y="324" class="l">– rewrites all files each time</text>
  <text x="352" y="360" class="b">Use for: existing tables on older</text>
  <text x="352" y="382" class="b">runtimes</text>
  <text x="664" y="236" class="l">+ keys stored in table metadata</text>
  <text x="664" y="258" class="l">+ incremental: OPTIMIZE reclusters</text>
  <text x="664" y="280" class="l">  only what changed</text>
  <text x="664" y="302" class="l">+ ALTER TABLE … CLUSTER BY changes</text>
  <text x="664" y="324" class="l">  keys without a rewrite</text>
  <text x="664" y="360" class="b">Use for: all new tables, high-</text>
  <text x="664" y="382" class="b">cardinality filters (or CLUSTER BY AUTO)</text>
</svg>
