<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Delete propagation: CDC and erasure requests are merged into users_bronze, whose change feed is streamed into users_silver and events_silver, then purged physically">
  <rect x="0.75" y="0.75" width="958.5" height="418.5" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <style>
    .t{font-size:18px;font-weight:600;fill:#0b0b0b}
    .h{font-size:14px;font-weight:600;fill:#0b0b0b}
    .l{font-size:13px;fill:#0b0b0b}
    .n{font-size:12px;fill:#52514e}
    .ln{stroke:#52514e;stroke-width:1.5;fill:none}
  </style>
  <text x="24" y="36" class="t">Propagating deletes with Change Data Feed</text>
  <text x="24" y="58" class="n">Delete once in Bronze; the change feed carries the delete to every downstream table, incrementally.</text>

  <!-- sources -->
  <rect x="30" y="92" width="170" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="44" y="115" class="h">CRM CDC file</text>
  <text x="44" y="135" class="n">UPDATE / DELETE rows</text>
  <rect x="30" y="172" width="170" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="44" y="195" class="h">delete_requests</text>
  <text x="44" y="215" class="n">erasure requests (GDPR)</text>
  <path d="M200,120 L248,146" class="ln" marker-end="url(#arr)"/>
  <path d="M200,200 L248,176" class="ln" marker-end="url(#arr)"/>
  <text x="224" y="166" class="n" text-anchor="middle">MERGE</text>

  <!-- bronze -->
  <rect x="250" y="108" width="180" height="100" rx="8" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.5"/>
  <text x="266" y="132" class="h">users_bronze</text>
  <text x="266" y="152" class="n">raw PII</text>
  <text x="266" y="170" class="n">CDF on</text>
  <text x="266" y="188" class="n">deletion vectors on</text>

  <path d="M430,158 H528" class="ln" marker-end="url(#arr)"/>
  <text x="479" y="148" class="n" text-anchor="middle">readChangeFeed</text>
  <text x="479" y="176" class="n" text-anchor="middle">availableNow</text>

  <!-- engine -->
  <rect x="530" y="108" width="180" height="100" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="546" y="132" class="h">apply_changes()</text>
  <text x="546" y="152" class="n">foreachBatch:</text>
  <text x="546" y="170" class="n">latest change per user_id,</text>
  <text x="546" y="188" class="n">then MERGE downstream</text>
  <rect x="530" y="250" width="180" height="50" rx="8" fill="#52514e" fill-opacity="0.1" stroke="#52514e" stroke-width="1.5"/>
  <text x="546" y="271" class="h">checkpoint</text>
  <text x="546" y="289" class="n">last processed version</text>
  <path d="M620,208 V248" class="ln" stroke-dasharray="5 4" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- silver -->
  <rect x="770" y="84" width="170" height="64" rx="8" fill="#6250d6" fill-opacity="0.12" stroke="#6250d6" stroke-width="1.5"/>
  <text x="784" y="108" class="h">users_silver</text>
  <text x="784" y="128" class="n">pseudonymized;</text>
  <text x="784" y="142" class="n">upsert or delete</text>
  <rect x="770" y="168" width="170" height="64" rx="8" fill="#6250d6" fill-opacity="0.12" stroke="#6250d6" stroke-width="1.5"/>
  <text x="784" y="192" class="h">events_silver</text>
  <text x="784" y="212" class="n">delete rows of</text>
  <text x="784" y="226" class="n">deleted users</text>
  <path d="M710,140 L768,118" class="ln" marker-end="url(#arr)"/>
  <path d="M710,176 L768,198" class="ln" marker-end="url(#arr)"/>

  <!-- purge -->
  <path d="M340,208 V258" class="ln" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="250" y="260" width="180" height="60" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="266" y="284" class="h">REORG … PURGE</text>
  <text x="266" y="304" class="n">+ VACUUM: physically gone</text>

  <text x="30" y="356" class="n">The stream reads only the commits after its checkpoint, so each run touches just the new changes. Sections B to G build this left to right.</text>

  <g transform="translate(30,378)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="22" y="12" class="n">source</text>
    <rect x="90" y="0" width="14" height="14" rx="3" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.5"/>
    <text x="112" y="12" class="n">Bronze</text>
    <rect x="180" y="0" width="14" height="14" rx="3" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
    <text x="202" y="12" class="n">processing</text>
    <rect x="290" y="0" width="14" height="14" rx="3" fill="#6250d6" fill-opacity="0.12" stroke="#6250d6" stroke-width="1.5"/>
    <text x="312" y="12" class="n">Silver</text>
    <rect x="370" y="0" width="14" height="14" rx="3" fill="#52514e" fill-opacity="0.1" stroke="#52514e" stroke-width="1.5"/>
    <text x="392" y="12" class="n">checkpoint</text>
    <rect x="480" y="0" width="14" height="14" rx="3" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
    <text x="502" y="12" class="n">physical delete</text>
  </g>
</svg>
