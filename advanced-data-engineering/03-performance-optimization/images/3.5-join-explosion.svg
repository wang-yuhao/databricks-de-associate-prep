<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ard{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
    </style>
  </defs>
  <text x="28" y="36" class="t">Join explosion: a non-unique key multiplies rows</text>
  <rect x="24" y="60" width="220" height="138" rx="8" fill="#2a78d6" fill-opacity="0.06" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="36" y="82" class="b">orders (customer 0)</text>
  <rect x="36" y="94" width="196" height="28" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="134.0" y="113.0" class="n" text-anchor="middle">order 1 · amount</text>
  <rect x="36" y="128" width="196" height="28" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="134.0" y="147.0" class="n" text-anchor="middle">order 2 · amount</text>
  <rect x="36" y="162" width="196" height="28" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="134.0" y="181.0" class="n" text-anchor="middle">order 3 · amount</text>
  <rect x="24" y="220" width="220" height="138" rx="8" fill="#2a78d6" fill-opacity="0.06" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="36" y="242" class="b">addresses (customer 0)</text>
  <rect x="36" y="254" width="196" height="28" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="134.0" y="273.0" class="n" text-anchor="middle">v1 · Berlin</text>
  <rect x="36" y="288" width="196" height="28" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="134.0" y="307.0" class="n" text-anchor="middle">v2 · Paris</text>
  <rect x="36" y="322" width="196" height="28" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="134.0" y="341.0" class="n" text-anchor="middle">v3 · Rome (current)</text>
  <rect x="290" y="182" width="130" height="56" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="355.0" y="205.0" class="b" text-anchor="middle">JOIN</text>
  <text x="355.0" y="224.0" class="l" text-anchor="middle">on customer_id</text>
  <path d="M244,140 L288,200" class="ar"/>
  <path d="M244,290 L288,222" class="ar"/>
  <path d="M420,210 L458,210" class="ar"/>
  <rect x="460" y="60" width="230" height="298" rx="8" fill="#e34948" fill-opacity="0.06" stroke="#e34948" stroke-width="1.5"/>
  <text x="472" y="82" class="b">join output: 3 × 3 = 9 rows</text>
  <rect x="472" y="92" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="109.0" class="n" text-anchor="middle">order 1 × v1</text>
  <rect x="472" y="121" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="138.0" class="n" text-anchor="middle">order 1 × v2</text>
  <rect x="472" y="150" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="167.0" class="n" text-anchor="middle">order 1 × v3</text>
  <rect x="472" y="179" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="196.0" class="n" text-anchor="middle">order 2 × v1</text>
  <rect x="472" y="208" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="225.0" class="n" text-anchor="middle">order 2 × v2</text>
  <rect x="472" y="237" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="254.0" class="n" text-anchor="middle">order 2 × v3</text>
  <rect x="472" y="266" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="283.0" class="n" text-anchor="middle">order 3 × v1</text>
  <rect x="472" y="295" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="312.0" class="n" text-anchor="middle">order 3 × v2</text>
  <rect x="472" y="324" width="206" height="24" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="575.0" y="341.0" class="n" text-anchor="middle">order 3 × v3</text>
  <rect x="720" y="60" width="216" height="140" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="828.0" y="93.5" class="b" text-anchor="middle">Problem</text>
  <text x="828.0" y="112.5" class="n" text-anchor="middle">Lab: 600 k orders × 20</text>
  <text x="828.0" y="128.5" class="n" text-anchor="middle">address versions = 12 M</text>
  <text x="828.0" y="144.5" class="n" text-anchor="middle">rows from ONE key.</text>
  <text x="828.0" y="160.5" class="n" text-anchor="middle">Revenue is counted 20×:</text>
  <text x="828.0" y="176.5" class="n" text-anchor="middle">the report is wrong.</text>
  <rect x="720" y="218" width="216" height="140" rx="8" fill="#008300" fill-opacity="0.12" stroke="#008300" stroke-width="1.5"/>
  <text x="828.0" y="259.5" class="b" text-anchor="middle">Fix</text>
  <text x="828.0" y="278.5" class="n" text-anchor="middle">filter is_current → one</text>
  <text x="828.0" y="294.5" class="n" text-anchor="middle">address row per customer</text>
  <text x="828.0" y="310.5" class="n" text-anchor="middle">→ join output =</text>
  <text x="828.0" y="326.5" class="n" text-anchor="middle">2 M rows, one per order.</text>
  <text x="24" y="386" class="n">Check join_output_rows against the row count of the larger input: more rows means a duplicate key.</text>
</svg>
