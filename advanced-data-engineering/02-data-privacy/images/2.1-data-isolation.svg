<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Data isolation: one catalog per region with its own managed storage location and workspace binding">
  <rect x="0.75" y="0.75" width="958.5" height="468.5" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker>
  </defs>
  <style>
    .t{font-size:18px;font-weight:600;fill:#0b0b0b}
    .h{font-size:14px;font-weight:600;fill:#0b0b0b}
    .l{font-size:13px;fill:#0b0b0b}
    .n{font-size:12px;fill:#52514e}
    .ln{stroke:#52514e;stroke-width:1.5;fill:none}
  </style>
  <text x="24" y="36" class="t">Data isolation: a catalog per region</text>
  <text x="24" y="58" class="n">Row filters hide rows logically. Residency rules need the data physically apart: separate storage, separate access paths.</text>

  <!-- EU stack -->
  <text x="40" y="92" class="h">EU</text>
  <rect x="40" y="104" width="360" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="56" y="127" class="h">EU workspace</text>
  <text x="56" y="147" class="n">EU analysts, EU service principal</text>
  <path d="M220,160 V222" class="ln" marker-end="url(#arr)"/>
  <text x="232" y="196" class="n">workspace-catalog binding</text>
  <rect x="40" y="224" width="360" height="56" rx="8" fill="#52514e" fill-opacity="0.1" stroke="#52514e" stroke-width="1.5"/>
  <text x="56" y="247" class="h">Catalog shop_eu</text>
  <text x="56" y="267" class="n">usable only from the EU workspace</text>
  <path d="M220,280 V342" class="ln" marker-end="url(#arr)"/>
  <text x="232" y="316" class="n">MANAGED LOCATION</text>
  <rect x="40" y="344" width="360" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="56" y="367" class="h">Storage in the EU cloud account</text>
  <text x="56" y="387" class="n">abfss://eu@… : managed tables never leave the region</text>

  <!-- US stack -->
  <text x="560" y="92" class="h">US</text>
  <rect x="560" y="104" width="360" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="576" y="127" class="h">US workspace</text>
  <text x="576" y="147" class="n">US analysts, US service principal</text>
  <path d="M740,160 V222" class="ln" marker-end="url(#arr)"/>
  <text x="752" y="196" class="n">workspace-catalog binding</text>
  <rect x="560" y="224" width="360" height="56" rx="8" fill="#52514e" fill-opacity="0.1" stroke="#52514e" stroke-width="1.5"/>
  <text x="576" y="247" class="h">Catalog shop_us</text>
  <text x="576" y="267" class="n">usable only from the US workspace</text>
  <path d="M740,280 V342" class="ln" marker-end="url(#arr)"/>
  <text x="752" y="316" class="n">MANAGED LOCATION</text>
  <rect x="560" y="344" width="360" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="576" y="367" class="h">Storage in the US cloud account</text>
  <text x="576" y="387" class="n">s3://us-…</text>

  <!-- blocked cross access -->
  <path d="M560,150 L402,238" fill="none" stroke="#e34948" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)"/>
  <rect x="446" y="179" width="68" height="24" rx="8" fill="#fcfcfb" stroke="#e34948" stroke-width="1.5"/>
  <text x="480" y="196" class="n" text-anchor="middle" style="fill:#0b0b0b">blocked</text>

  <text x="40" y="430" class="n">Locally the notebook mimics this with one schema per region, each stored in its own directory (next cell).</text>

  <rect x="40" y="444" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="62" y="456" class="n">users / external storage</text>
  <rect x="230" y="444" width="14" height="14" rx="3" fill="#52514e" fill-opacity="0.1" stroke="#52514e" stroke-width="1.5"/>
  <text x="252" y="456" class="n">catalog (securable)</text>
  <line x1="390" y1="451" x2="426" y2="451" stroke="#e34948" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="434" y="456" class="n">access denied by the binding</text>
</svg>
