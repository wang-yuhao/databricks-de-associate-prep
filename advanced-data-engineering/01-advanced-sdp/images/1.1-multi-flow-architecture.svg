<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Multi-flow pipeline: two landing zones feed two append flows with separate checkpoints into bronze_events, then silver_events with expectations and silver_quarantine, then the gold_daily_metrics materialized view">
  <style>
    text{fill:#0b0b0b}
    .t{font-size:18px;font-weight:600}
    .l{font-size:13px}
    .b{font-size:13px;font-weight:600}
    .n{font-size:12px;fill:#52514e}
    .m{text-anchor:middle}
    .src{fill:#2a78d6;fill-opacity:.12;stroke:#2a78d6;stroke-width:1.5}
    .brz{fill:#eb6834;fill-opacity:.12;stroke:#eb6834;stroke-width:1.5}
    .slv{fill:#6250d6;fill-opacity:.12;stroke:#6250d6;stroke-width:1.5}
    .gld{fill:#eda100;fill-opacity:.14;stroke:#eda100;stroke-width:1.5}
    .flw{fill:#1baf7a;fill-opacity:.12;stroke:#1baf7a;stroke-width:1.5}
    .bad{fill:#e34948;fill-opacity:.10;stroke:#e34948;stroke-width:1.5}
    .meta{fill:#52514e;fill-opacity:.08;stroke:#52514e;stroke-width:1.5}
    .dash{stroke-dasharray:5 4}
    .a{fill:none;stroke:#52514e;stroke-width:1.5;marker-end:url(#ah)}
    .d{fill:none;stroke:#52514e;stroke-width:1.5;stroke-dasharray:4 4}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="444" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <text class="t" x="24" y="36">Multi-flow pipeline: two sources, one Bronze table, quality-gated Silver</text>

  <!-- column headers -->
  <text class="n m" x="94" y="72">Landing zones</text>
  <text class="n m" x="268" y="72">Append flows</text>
  <text class="n m" x="455" y="72">Bronze</text>
  <text class="n m" x="672" y="72">Silver</text>
  <text class="n m" x="870" y="72">Gold</text>

  <!-- sources -->
  <rect class="src" x="24" y="96" width="140" height="64" rx="8"/>
  <text class="b m" x="94" y="123">source_flow_a/</text>
  <text class="n m" x="94" y="143">JSON files</text>
  <rect class="src" x="24" y="250" width="140" height="64" rx="8"/>
  <text class="b m" x="94" y="277">source_flow_b/</text>
  <text class="n m" x="94" y="297">JSON files</text>

  <!-- flows + checkpoints -->
  <rect class="flw" x="204" y="96" width="128" height="64" rx="8"/>
  <text class="b m" x="268" y="123">flow_a</text>
  <text class="n m" x="268" y="143">@dp.append_flow</text>
  <rect class="meta dash" x="214" y="180" width="108" height="28" rx="8"/>
  <text class="n m" x="268" y="199">checkpoint A</text>
  <path class="d" d="M268,160 V180"/>

  <rect class="flw" x="204" y="250" width="128" height="64" rx="8"/>
  <text class="b m" x="268" y="277">flow_b</text>
  <text class="n m" x="268" y="297">@dp.append_flow</text>
  <rect class="meta dash" x="214" y="334" width="108" height="28" rx="8"/>
  <text class="n m" x="268" y="353">checkpoint B</text>
  <path class="d" d="M268,314 V334"/>

  <path class="a" d="M164,128 H202"/>
  <path class="a" d="M164,282 H202"/>

  <!-- bronze -->
  <rect class="brz" x="384" y="150" width="142" height="110" rx="8"/>
  <text class="b m" x="455" y="182">bronze_events</text>
  <text class="n m" x="455" y="202">streaming table</text>
  <text class="n m" x="455" y="220">no expectations</text>
  <text class="n m" x="455" y="238">+ source_flow column</text>
  <path class="a" d="M332,128 H356 V180 H382"/>
  <path class="a" d="M332,282 H356 V230 H382"/>

  <!-- silver -->
  <rect class="slv" x="572" y="84" width="200" height="170" rx="8"/>
  <text class="b m" x="672" y="110">silver_events</text>
  <text class="n m" x="672" y="129">cluster_by: status, ingest_date</text>
  <line x1="588" y1="142" x2="756" y2="142" stroke="#6250d6" stroke-opacity=".35"/>
  <text class="l" x="588" y="164"><tspan font-weight="600">warn</tspan>  non_negative_amount</text>
  <text class="l" x="588" y="190"><tspan font-weight="600">drop</tspan>  valid_timestamp,</text>
  <text class="l" x="626" y="208">valid_status</text>
  <text class="l" x="588" y="234"><tspan font-weight="600">fail</tspan>  valid_event_id</text>

  <rect class="bad" x="572" y="290" width="200" height="72" rx="8"/>
  <text class="b m" x="672" y="315">silver_quarantine</text>
  <text class="n m" x="672" y="334">inverse of the drop rules</text>
  <text class="n m" x="672" y="351">+ failed_expectations</text>

  <path class="a" d="M526,180 H570"/>
  <path class="a" d="M526,235 H548 V326 H570"/>

  <!-- gold -->
  <rect class="gld" x="788" y="124" width="148" height="90" rx="8"/>
  <text class="b m" x="862" y="151">gold_daily_metrics</text>
  <text class="n m" x="862" y="171">materialized view</text>
  <text class="n m" x="862" y="191">cluster_by: ingest_date</text>
  <path class="a" d="M772,169 H786"/>

  <text class="n" x="24" y="392">Each flow keeps its own checkpoint, so a source can be added, removed, or backfilled without a full refresh of the others.</text>

  <!-- legend -->
  <g transform="translate(24,422)">
    <rect class="src" x="0" y="-11" width="14" height="14" rx="3"/><text class="n" x="20" y="0">Source files</text>
    <rect class="flw" x="112" y="-11" width="14" height="14" rx="3"/><text class="n" x="132" y="0">Flow</text>
    <rect class="brz" x="186" y="-11" width="14" height="14" rx="3"/><text class="n" x="206" y="0">Bronze</text>
    <rect class="slv" x="270" y="-11" width="14" height="14" rx="3"/><text class="n" x="290" y="0">Silver</text>
    <rect class="gld" x="350" y="-11" width="14" height="14" rx="3"/><text class="n" x="370" y="0">Gold</text>
    <rect class="bad" x="424" y="-11" width="14" height="14" rx="3"/><text class="n" x="444" y="0">Quarantine</text>
    <rect class="meta dash" x="530" y="-11" width="14" height="14" rx="3"/><text class="n" x="550" y="0">Checkpoint</text>
  </g>
</svg>
