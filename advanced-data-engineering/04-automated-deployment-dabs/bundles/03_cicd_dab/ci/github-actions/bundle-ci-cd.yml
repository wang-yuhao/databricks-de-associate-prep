# Example GitHub Actions pipeline for this bundle. It is NOT active here: copy it to
# .github/workflows/ of the repository that hosts the bundle and adjust `working-directory`.
#
# Configure in GitHub (Settings -> Secrets and variables -> Actions), names only, never commit values:
#   DATABRICKS_HOST                              workspace URL
#   DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET  OAuth M2M credentials of the deployment service principal
# and create GitHub environments "stage" and "prod" (add required reviewers to "prod").
name: orders-bundle-ci-cd

on:
  pull_request:
    paths: ["04-automated-deployment-dabs/bundles/03_cicd_dab/**"]
  push:
    branches: [main]
    paths: ["04-automated-deployment-dabs/bundles/03_cicd_dab/**"]
  release:
    types: [published]

defaults:
  run:
    working-directory: 04-automated-deployment-dabs/bundles/03_cicd_dab

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  ci:                                     # Continuous integration: every pull request and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        run: |
          pip install pyspark==4.2.0 pytest
          pip install -e .
          pytest -q
      - uses: databricks/setup-cli@main
      - name: Validate bundle against the stage workspace
        run: databricks bundle validate -t stage

  deploy-stage:                           # Continuous deployment: every merge to main
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5    # `bundle deploy` builds the wheel artifact with `python -m pip wheel`
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t stage
      - name: Integration test on stage
        run: databricks bundle run -t stage orders_cicd_job

  deploy-prod:                            # Release: a published GitHub release, after approval
    if: github.event_name == 'release'
    needs: ci
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
