<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="469" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ard{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
    </style>
  </defs>
  <text x="28" y="36" class="t">One action → jobs → stages → tasks</text>
  <rect x="24" y="60" width="240" height="58" rx="8" fill="#52514e" fill-opacity="0.12" stroke="#52514e" stroke-width="1.5"/>
  <text x="144.0" y="84.0" class="b" text-anchor="middle">Action (your query)</text>
  <text x="144.0" y="103.0" class="l" text-anchor="middle">df.write / count() / collect()</text>
  <rect x="330" y="60" width="240" height="58" rx="8" fill="#52514e" fill-opacity="0.12" stroke="#52514e" stroke-width="1.5"/>
  <text x="450.0" y="84.0" class="b" text-anchor="middle">Job 0</text>
  <text x="450.0" y="103.0" class="l" text-anchor="middle">scheduled by the driver</text>
  <path d="M264,89 L328,89" class="ar"/>
  <text x="600" y="84" class="n">An action can start several jobs</text>
  <text x="600" y="101" class="n">(schema inference, broadcast, AQE re-plans).</text>
  <path d="M400,118 L400,140 L214,140 L214,168" class="ard"/>
  <path d="M500,118 L500,140 L760,140 L760,168" class="ard"/>
  <rect x="24" y="170" width="380" height="210" rx="8" fill="#1baf7a" fill-opacity="0.06" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="40" y="194" class="b">Stage 0 · scan, filter, withColumn</text>
  <text x="40" y="213" class="n">narrow work, no data moves</text>
  <rect x="44" y="240" width="76" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="82.0" y="266.5" class="b" text-anchor="middle">Task 0</text>
  <text x="82.0" y="285.5" class="n" text-anchor="middle">partition 0</text>
  <rect x="132" y="240" width="76" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="170.0" y="266.5" class="b" text-anchor="middle">Task 1</text>
  <text x="170.0" y="285.5" class="n" text-anchor="middle">partition 1</text>
  <rect x="220" y="240" width="76" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="258.0" y="266.5" class="b" text-anchor="middle">Task 2</text>
  <text x="258.0" y="285.5" class="n" text-anchor="middle">partition 2</text>
  <rect x="308" y="240" width="76" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="346.0" y="266.5" class="b" text-anchor="middle">Task 3</text>
  <text x="346.0" y="285.5" class="n" text-anchor="middle">partition 3</text>
  <text x="214" y="340" class="n" text-anchor="middle">one task per input partition</text>
  <text x="214" y="358" class="n" text-anchor="middle">tasks run in parallel, one per core</text>
  <rect x="430" y="225" width="130" height="100" rx="8" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="495.0" y="261.5" class="b" text-anchor="middle">Shuffle</text>
  <text x="495.0" y="280.5" class="l" text-anchor="middle">write → read</text>
  <text x="495.0" y="297.5" class="l" text-anchor="middle">stage boundary</text>
  <path d="M404,275 L428,275" class="ar"/>
  <path d="M560,275 L584,275" class="ar"/>
  <rect x="586" y="170" width="350" height="210" rx="8" fill="#1baf7a" fill-opacity="0.06" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="602" y="194" class="b">Stage 1 · after groupBy / join</text>
  <text x="602" y="213" class="n">reads shuffle output</text>
  <rect x="640" y="240" width="104" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="692.0" y="266.5" class="b" text-anchor="middle">Task 0</text>
  <text x="692.0" y="285.5" class="n" text-anchor="middle">shuffle part 0</text>
  <rect x="770" y="240" width="104" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="822.0" y="266.5" class="b" text-anchor="middle">Task 1</text>
  <text x="822.0" y="285.5" class="n" text-anchor="middle">shuffle part 1</text>
  <text x="761" y="340" class="n" text-anchor="middle">task count = shuffle partitions</text>
  <text x="761" y="358" class="n" text-anchor="middle">(after AQE coalescing)</text>
  <text x="24" y="412" class="n">Spark UI path: Jobs tab → click a job → its stages → click a stage → task table and Event Timeline.</text>
  <rect x="24" y="437" width="16" height="14" rx="3" fill="#52514e" fill-opacity="0.12" stroke="#52514e" stroke-width="1.5"/>
  <text x="46" y="448" class="n">driver / scheduling</text>
  <rect x="195.39999999999998" y="437" width="16" height="14" rx="3" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="217.39999999999998" y="448" class="n">stage and task (executor work)</text>
  <rect x="439.4" y="437" width="16" height="14" rx="3" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="461.4" y="448" class="n">shuffle</text>
</svg>
