[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adelab"
version = "1.0.0"
description = "Local practice runtime for the Databricks Advanced Data Engineering courses"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
include = ["adelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
