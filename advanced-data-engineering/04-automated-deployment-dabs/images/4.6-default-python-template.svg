<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .src{fill:#2a78d6;fill-opacity:0.12;stroke:#2a78d6;stroke-width:1.5}
      .cfg{fill:#52514e;fill-opacity:0.1;stroke:#52514e;stroke-width:1.5}
      .opt{fill:#52514e;fill-opacity:0.05;stroke:#52514e;stroke-width:1.5;stroke-dasharray:5 4}
      .dev{fill:#6250d6;fill-opacity:0.12;stroke:#6250d6;stroke-width:1.5}
      .prd{fill:#eb6834;fill-opacity:0.12;stroke:#eb6834;stroke-width:1.5}
    </style>
  </defs>
  <text x="30" y="36" class="t">databricks bundle init default-python: template in, project out</text>

  <!-- inputs -->
  <rect x="30" y="64" width="230" height="96" rx="8" class="opt"/>
  <text x="44" y="88" class="b">Template questions</text>
  <text x="44" y="110" class="l">project_name, include a job,</text>
  <text x="44" y="127" class="l">pipeline, Python package...</text>
  <text x="44" y="148" class="n">answers: --config-file *.json</text>

  <rect x="30" y="190" width="230" height="96" rx="8" class="src"/>
  <text x="44" y="214" class="b">bundle init default-python</text>
  <text x="44" y="236" class="l">renders the template with</text>
  <text x="44" y="253" class="l">your answers and your</text>
  <text x="44" y="270" class="l">workspace user name</text>

  <line x1="145" y1="160" x2="145" y2="188" class="ar"/>
  <line x1="260" y1="238" x2="298" y2="238" class="ar"/>

  <!-- generated tree -->
  <rect x="300" y="64" width="400" height="320" rx="8" class="src"/>
  <text x="316" y="90" class="b">my_default_project/</text>
  <g class="l">
    <text x="332" y="120" font-weight="600">databricks.yml</text>
    <text x="332" y="158" font-weight="600">resources/</text>
    <text x="332" y="196" font-weight="600">src/</text>
    <text x="332" y="234" font-weight="600">tests/</text>
    <text x="332" y="272" font-weight="600">fixtures/</text>
    <text x="332" y="310" font-weight="600">pyproject.toml</text>
    <text x="332" y="348" font-weight="600">README.md, .vscode/</text>
  </g>
  <g class="n">
    <text x="332" y="137">bundle, include, variables, targets dev + prod</text>
    <text x="332" y="175">job (and pipeline) definitions, one file each</text>
    <text x="332" y="213">Python package, notebook, pipeline code</text>
    <text x="332" y="251">pytest; Spark through Databricks Connect</text>
    <text x="332" y="289">small sample data for the tests</text>
    <text x="332" y="327">package metadata; builds the wheel</text>
    <text x="332" y="365">next steps; editor settings for the extension</text>
  </g>

  <!-- targets -->
  <rect x="740" y="80" width="190" height="96" rx="8" class="dev"/>
  <text x="754" y="104" class="b">target dev</text>
  <text x="754" y="126" class="l">mode: development,</text>
  <text x="754" y="143" class="l">default: true,</text>
  <text x="754" y="160" class="l">your user folder</text>

  <rect x="740" y="200" width="190" height="96" rx="8" class="prd"/>
  <text x="754" y="224" class="b">target prod</text>
  <text x="754" y="246" class="l">mode: production,</text>
  <text x="754" y="263" class="l">shared root path,</text>
  <text x="754" y="280" class="l">permissions</text>

  <line x1="700" y1="124" x2="738" y2="128" class="ar"/>
  <line x1="700" y1="130" x2="738" y2="244" class="ar"/>

  <text x="30" y="412" class="n">Dashed = input · blue = generated source · purple = dev · orange = prod. Exact file names depend on the CLI version: run bundles.tree() to see yours.</text>
</svg>
