<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="30" y="36" class="t">DevOps loop: every change takes the same automated path to production</text>

  <!-- top row: left to right -->
  <rect x="40" y="70" width="190" height="76" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="54" y="98" class="b">1 · Write code</text>
  <text x="54" y="120" class="l">src/, notebooks,</text>
  <text x="54" y="137" class="l">bundle YAML</text>

  <rect x="270" y="70" width="190" height="76" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="284" y="98" class="b">2 · Commit, open PR</text>
  <text x="284" y="120" class="l">Git branch + code review</text>

  <rect x="500" y="70" width="190" height="76" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="514" y="98" class="b">3 · CI: build and test</text>
  <text x="514" y="120" class="l">unit tests, wheel build,</text>
  <text x="514" y="137" class="l">bundle validate</text>

  <rect x="730" y="70" width="190" height="76" rx="8" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="744" y="98" class="b">4 · CD: deploy to stage</text>
  <text x="744" y="120" class="l">bundle deploy -t stage</text>

  <line x1="230" y1="108" x2="268" y2="108" class="ar"/>
  <line x1="460" y1="108" x2="498" y2="108" class="ar"/>
  <line x1="690" y1="108" x2="728" y2="108" class="ar"/>
  <line x1="825" y1="146" x2="825" y2="248" class="ar"/>

  <!-- bottom row: right to left -->
  <rect x="730" y="250" width="190" height="76" rx="8" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/>
  <text x="744" y="278" class="b">5 · Integration test</text>
  <text x="744" y="300" class="l">bundle run -t stage</text>
  <text x="744" y="317" class="l">on representative data</text>

  <rect x="500" y="250" width="190" height="76" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="514" y="278" class="b">6 · Approve release</text>
  <text x="514" y="300" class="l">required reviewers</text>
  <text x="514" y="317" class="l">gate the prod deploy</text>

  <rect x="270" y="250" width="190" height="76" rx="8" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.5"/>
  <text x="284" y="278" class="b">7 · Deploy to prod</text>
  <text x="284" y="300" class="l">bundle deploy -t prod,</text>
  <text x="284" y="317" class="l">same commit as stage</text>

  <rect x="40" y="250" width="190" height="76" rx="8" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.5"/>
  <text x="54" y="278" class="b">8 · Monitor</text>
  <text x="54" y="300" class="l">job runs, data quality,</text>
  <text x="54" y="317" class="l">alerts</text>

  <line x1="730" y1="288" x2="692" y2="288" class="ar"/>
  <line x1="500" y1="288" x2="462" y2="288" class="ar"/>
  <line x1="270" y1="288" x2="232" y2="288" class="ar"/>

  <!-- feedback loop -->
  <line x1="100" y1="250" x2="100" y2="148" class="ar" stroke-dasharray="5 4"/>
  <text x="92" y="204" class="n" text-anchor="end">feedback</text>

  <!-- failure path -->
  <path d="M595,146 V198 H190 V148" fill="none" stroke="#e34948" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="392" y="190" class="n" text-anchor="middle">red build: pipeline stops, fix and push again</text>

  <!-- legend -->
  <g class="n">
    <rect x="40" y="358" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/><text x="60" y="370">developer</text>
    <rect x="150" y="358" width="14" height="14" rx="3" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/><text x="170" y="370">CI system</text>
    <rect x="260" y="358" width="14" height="14" rx="3" fill="#eda100" fill-opacity="0.12" stroke="#eda100" stroke-width="1.5"/><text x="280" y="370">stage target</text>
    <rect x="380" y="358" width="14" height="14" rx="3" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.5"/><text x="400" y="370">prod target</text>
    <line x1="490" y1="365" x2="520" y2="365" stroke="#e34948" stroke-width="1.5" stroke-dasharray="5 4"/><text x="528" y="370">failed build</text>
    <text x="640" y="370">CI = steps 2-3 · CD = steps 4-7</text>
  </g>
</svg>
