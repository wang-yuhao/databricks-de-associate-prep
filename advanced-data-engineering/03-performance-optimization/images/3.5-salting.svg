<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#fcfcfb" stroke="#e4e2dc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .t{font-size:18px;font-weight:600;fill:#0b0b0b}
      .b{font-size:14px;font-weight:600;fill:#0b0b0b}
      .l{font-size:13px;fill:#0b0b0b}
      .n{font-size:12px;fill:#52514e}
      .ar{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ard{stroke:#52514e;stroke-width:1.5;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
    </style>
  </defs>
  <text x="28" y="36" class="t">Salting: spread a hot key over N sub-keys</text>
  <rect x="24" y="80" width="210" height="76" rx="8" fill="#e34948" fill-opacity="0.12" stroke="#e34948" stroke-width="1.5"/>
  <text x="129.0" y="113.0" class="b" text-anchor="middle">orders (big side)</text>
  <text x="129.0" y="132.0" class="l" text-anchor="middle">600 k rows, all customer_id 0</text>
  <rect x="24" y="290" width="210" height="76" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="129.0" y="323.0" class="b" text-anchor="middle">current_addr (small side)</text>
  <text x="129.0" y="342.0" class="l" text-anchor="middle">1 row for customer_id 0</text>
  <rect x="280" y="80" width="200" height="76" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="380.0" y="104.5" class="b" text-anchor="middle">add a random salt</text>
  <text x="380.0" y="123.5" class="l" text-anchor="middle">salt = rand() × N</text>
  <text x="380.0" y="140.5" class="l" text-anchor="middle">(each row gets 0…N-1)</text>
  <rect x="280" y="290" width="200" height="76" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="380.0" y="314.5" class="b" text-anchor="middle">replicate N times</text>
  <text x="380.0" y="333.5" class="l" text-anchor="middle">salt = explode(0…N-1)</text>
  <text x="380.0" y="350.5" class="l" text-anchor="middle">(row copied N times)</text>
  <path d="M234,118 L278,118" class="ar"/>
  <path d="M234,328 L278,328" class="ar"/>
  <rect x="560" y="64" width="240" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="680.0" y="90.5" class="b" text-anchor="middle">task: (0, salt 0)</text>
  <text x="680.0" y="109.5" class="n" text-anchor="middle">150 k orders + 1 address row</text>
  <path d="M480,118 L558,88" class="ar"/>
  <path d="M480,328 L558,104" class="ar"/>
  <rect x="560" y="144" width="240" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="680.0" y="170.5" class="b" text-anchor="middle">task: (0, salt 1)</text>
  <text x="680.0" y="189.5" class="n" text-anchor="middle">150 k orders + 1 address row</text>
  <path d="M480,118 L558,168" class="ar"/>
  <path d="M480,328 L558,184" class="ar"/>
  <rect x="560" y="224" width="240" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="680.0" y="250.5" class="b" text-anchor="middle">task: (0, salt 2)</text>
  <text x="680.0" y="269.5" class="n" text-anchor="middle">150 k orders + 1 address row</text>
  <path d="M480,118 L558,248" class="ar"/>
  <path d="M480,328 L558,264" class="ar"/>
  <rect x="560" y="304" width="240" height="62" rx="8" fill="#1baf7a" fill-opacity="0.12" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="680.0" y="330.5" class="b" text-anchor="middle">task: (0, salt 3)</text>
  <text x="680.0" y="349.5" class="n" text-anchor="middle">150 k orders + 1 address row</text>
  <path d="M480,118 L558,328" class="ar"/>
  <path d="M480,328 L558,344" class="ar"/>
  <text x="820" y="90" class="n">join on</text>
  <text x="820" y="107" class="n">(customer_id, salt)</text>
  <text x="820" y="140" class="n">N = 4 here,</text>
  <text x="820" y="157" class="n">N = 16 in the lab</text>
  <text x="820" y="200" class="n">cost: small side</text>
  <text x="820" y="217" class="n">grows N×</text>
  <text x="24" y="410" class="n">Unlike AQE skew join, salting also works for skewed aggregations and window functions.</text>
</svg>
