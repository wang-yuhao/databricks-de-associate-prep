  <text x="480.0" y="327.5" class="b" text-anchor="middle">File explosion</text>
  <text x="480.0" y="346.5" class="l" text-anchor="middle">8 write tasks × 200 store_id values → up to 1,600 files of a few KB for a table of a few MB.</text>
  <text x="480.0" y="363.5" class="l" text-anchor="middle">PARTITIONED BY customer_id (50,000 values) would create 50,000 directories.</text>
  <text x="24" y="404" class="n">Rule: partition only by low-cardinality columns that almost every query filters on, with ≥ 1 GB per partition.</text>
