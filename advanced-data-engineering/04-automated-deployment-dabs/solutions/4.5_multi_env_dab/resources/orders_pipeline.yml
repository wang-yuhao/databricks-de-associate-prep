resources:
  pipelines:
    orders_pipeline:
      name: orders_pipeline_${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      channel: CURRENT
      root_path: ../src/pipelines/orders
      libraries:
        - glob:
            include: ../src/pipelines/orders/transformations/**
      configuration:
        landing_path: /Volumes/${var.catalog}/${var.schema}/${var.landing_volume}/orders
